<div class="modal-overlay" (click)="cancelled.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Delivery Note — {{ saleNo }}</h3>
      <button class="btn-icon" (click)="cancelled.emit()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Vehicle Number <span>*</span></label>
        <input type="text" class="form-control" [class.error]="isInvalid"
          [ngModel]="vehicleNo()" (ngModelChange)="vehicleNo.set($event)"
          placeholder="e.g. NP-ABC-1234" autofocus
          (keydown.enter)="onConfirm()" />
        @if (isInvalid) {
          <span class="form-error">Vehicle number is required</span>
        }
      </div>

      <div class="modal-footer" style="padding:0; margin-top:24px;">
        <button type="button" class="btn btn-outline" (click)="cancelled.emit()">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onConfirm()">
          Print Delivery Note
        </button>
      </div>
    </div>
  </div>
</div>
